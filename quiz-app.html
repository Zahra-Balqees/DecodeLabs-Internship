<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Knowledge Quiz</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --card-bg: #ffffff;
    --card-border: #111111;
    --option-bg: #ffffff;
    --option-border: #111111;
    --option-hover-bg: #111111;
    --option-hover-fg: #ffffff;
    --option-selected-bg: #111111;
    --option-selected-fg: #ffffff;
    --accent: #111111;
    --muted: #555555;
    --track-bg: #e6e6e6;
    --track-fill: #111111;
  }

  [data-theme="dark"] {
    --bg: #050b18;
    --fg: #eaf1ff;
    --card-bg: #0b1730;
    --card-border: #1e63ff;
    --option-bg: #0b1730;
    --option-border: #1e63ff;
    --option-hover-bg: #1e63ff;
    --option-hover-fg: #050b18;
    --option-selected-bg: #1e63ff;
    --option-selected-fg: #050b18;
    --accent: #1e63ff;
    --muted: #7d93c4;
    --track-bg: #101d3d;
    --track-fill: #1e63ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Courier New', Courier, monospace;
    transition: background 0.35s ease, color 0.35s ease;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .wrap {
    width: 100%;
    max-width: 620px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
    border-bottom: 3px solid var(--fg);
    padding-bottom: 14px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .brand .tag {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .brand h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: -0.5px;
  }

  .toggle-btn {
    border: 2px solid var(--fg);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 0;
    transition: background 0.25s ease, color 0.25s ease;
    white-space: nowrap;
  }

  .toggle-btn:hover {
    background: var(--fg);
    color: var(--bg);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .track {
    height: 6px;
    width: 100%;
    background: var(--track-bg);
    margin-bottom: 30px;
    position: relative;
  }

  .track-fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--track-fill);
    transition: width 0.3s ease;
  }

  .card {
    border: 2px solid var(--card-border);
    background: var(--card-bg);
    padding: 30px 26px;
  }

  .q-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .q-number {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .set-label {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .timer-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .timer-num {
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    min-width: 34px;
    text-align: right;
  }

  .timer-track {
    width: 70px;
    height: 6px;
    background: var(--track-bg);
    position: relative;
    overflow: hidden;
  }

  .timer-fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--accent);
    width: 100%;
    transition: width 1s linear;
  }

  .timer-fill.is-urgent {
    background: #d94f4f;
  }

  .q-text {
    font-size: 20px;
    line-height: 1.4;
    margin: 0 0 26px 0;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    border: 2px solid var(--option-border);
    background: var(--option-bg);
    color: var(--fg);
    padding: 14px 16px;
    text-align: left;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }

  .option:hover:not(:disabled) {
    background: var(--option-hover-bg);
    color: var(--option-hover-fg);
  }

  .option:active:not(:disabled) {
    transform: scale(0.99);
  }

  .option.is-selected {
    background: var(--option-selected-bg);
    color: var(--option-selected-fg);
  }

  .option:disabled {
    cursor: default;
    opacity: 0.55;
  }

  .option .letter {
    font-weight: bold;
    border: 1px solid currentColor;
    width: 22px;
    height: 22px;
    min-width: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .next-btn {
    margin-top: 26px;
    width: 100%;
    border: 2px solid var(--fg);
    background: var(--fg);
    color: var(--bg);
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    display: none;
  }

  .next-btn.is-visible { display: block; }

  .next-btn:hover { opacity: 0.85; }

  .result-card {
    text-align: center;
  }

  .result-card .headline {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .result-card .score-big {
    font-size: 64px;
    font-weight: bold;
    margin: 6px 0 4px 0;
    color: var(--accent);
  }

  .result-card .score-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 26px;
  }

  .result-card .accuracy-line {
    font-size: 18px;
    margin-bottom: 28px;
  }

  .restart-btn {
    border: 2px solid var(--fg);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 13px 20px;
    cursor: pointer;
    width: 100%;
  }

  .restart-btn:hover {
    background: var(--fg);
    color: var(--bg);
  }

  .review {
    margin-top: 30px;
    text-align: left;
  }

  .review-title {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    border-bottom: 2px solid var(--fg);
    padding-bottom: 8px;
  }

  .review-item {
    border: 2px solid var(--card-border);
    padding: 16px 18px;
    margin-bottom: 12px;
  }

  .review-q {
    font-size: 15px;
    margin: 0 0 10px 0;
    line-height: 1.4;
  }

  .review-line {
    font-size: 13px;
    margin: 4px 0;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .review-line .tag-badge {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid currentColor;
    min-width: 58px;
    text-align: center;
    flex-shrink: 0;
  }

  .review-line.correct { color: #2e8b57; }
  [data-theme="dark"] .review-line.correct { color: #4fd18a; }

  .review-line.wrong { color: #d94f4f; }
  [data-theme="dark"] .review-line.wrong { color: #ff7a7a; }

  .review-line.answer-key { color: var(--fg); }

  footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body data-theme="light">
<div class="wrap">
  <header>
    <div class="brand">
      <span class="tag">Interactive Web Elements</span>
      <h1>General Knowledge Quiz</h1>
    </div>
    <button class="toggle-btn" id="themeToggle" type="button">Dark Mode</button>
  </header>

  <div id="quizArea">
    <div class="progress-row">
      <span id="progressLabel">Question 1 of 10</span>
      <span id="scoreLabel">Answered: 0</span>
    </div>
    <div class="track"><div class="track-fill" id="trackFill" style="width: 0%;"></div></div>

    <div class="card" id="questionCard">
      <div class="q-top-row">
        <div class="q-number" id="qNumber">Q1</div>
        <div class="timer-row">
          <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
          <span class="timer-num" id="timerNum">10s</span>
        </div>
      </div>
      <div class="set-label" id="setLabel">Set A</div>
      <p class="q-text" id="qText"></p>
      <div class="options" id="optionsList"></div>
    </div>

    <button class="next-btn" id="nextBtn" type="button">Next Question</button>
  </div>

  <div id="resultArea" style="display:none;">
    <div class="card result-card">
      <div class="headline">Quiz Complete</div>
      <div class="score-big" id="scoreBig">0/10</div>
      <div class="score-sub" id="scoreSub">correct answers</div>
      <div class="accuracy-line" id="accuracyLine">Accuracy: 0%</div>
      <button class="restart-btn" id="restartBtn" type="button">Restart Quiz</button>
    </div>
    <div class="review" id="reviewList">
      <div class="review-title">Answer Key</div>
    </div>
  </div>

  <footer>A quiz to enhance your knowledge!</footer>
</div>

<script>
  // ---- Data: 3 separate general knowledge sets ----
  const questionSets = [
    [
      { q: "What is the capital of Australia?", options: ["Sydney", "Melbourne", "Canberra", "Perth"], answer: 2 },
      { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], answer: 1 },
      { q: "Who wrote the play 'Romeo and Juliet'?", options: ["Charles Dickens", "William Shakespeare", "Mark Twain", "Leo Tolstoy"], answer: 1 },
      { q: "What is the largest ocean on Earth?", options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"], answer: 3 },
      { q: "How many continents are there on Earth?", options: ["5", "6", "7", "8"], answer: 2 },
      { q: "What gas do plants primarily absorb for photosynthesis?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], answer: 2 },
      { q: "Which country gifted the Statue of Liberty to the USA?", options: ["Spain", "France", "Italy", "United Kingdom"], answer: 1 },
      { q: "What is the smallest prime number?", options: ["0", "1", "2", "3"], answer: 2 },
      { q: "Which organ in the human body pumps blood?", options: ["Lungs", "Liver", "Brain", "Heart"], answer: 3 },
      { q: "What is the chemical symbol for gold?", options: ["Go", "Gd", "Au", "Ag"], answer: 2 }
    ],
    [
      { q: "Which country is home to the Great Barrier Reef?", options: ["Brazil", "Australia", "Indonesia", "Mexico"], answer: 1 },
      { q: "Who painted the Mona Lisa?", options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Claude Monet"], answer: 2 },
      { q: "What is the tallest mountain in the world?", options: ["K2", "Kangchenjunga", "Mount Everest", "Lhotse"], answer: 2 },
      { q: "Which language has the most native speakers worldwide?", options: ["English", "Spanish", "Hindi", "Mandarin Chinese"], answer: 3 },
      { q: "What is the currency of Japan?", options: ["Won", "Yuan", "Yen", "Ringgit"], answer: 2 },
      { q: "How many players are on a standard soccer team on the field?", options: ["9", "10", "11", "12"], answer: 2 },
      { q: "Which gas makes up most of Earth's atmosphere?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Argon"], answer: 2 },
      { q: "Who is known as the Father of Computers?", options: ["Alan Turing", "Charles Babbage", "John von Neumann", "Ada Lovelace"], answer: 1 },
      { q: "What is the longest river in the world?", options: ["Amazon River", "Yangtze River", "Mississippi River", "Nile River"], answer: 3 },
      { q: "Which shape has three sides?", options: ["Square", "Triangle", "Pentagon", "Hexagon"], answer: 1 }
    ],
    [
      { q: "Which country hosted the 2016 Summer Olympics?", options: ["China", "United Kingdom", "Brazil", "Japan"], answer: 2 },
      { q: "What is the freezing point of water in Celsius?", options: ["0°C", "10°C", "32°C", "100°C"], answer: 0 },
      { q: "Who wrote 'Pride and Prejudice'?", options: ["Emily Bronte", "Jane Austen", "Virginia Woolf", "Mary Shelley"], answer: 1 },
      { q: "What is the national sport of Japan?", options: ["Judo", "Karate", "Sumo wrestling", "Kendo"], answer: 2 },
      { q: "Which planet has the most moons in our solar system?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: 3 },
      { q: "What does 'www' stand for?", options: ["World Wide Web", "World Wide Wire", "Web Wide World", "Wide World Web"], answer: 0 },
      { q: "Which metal is liquid at room temperature?", options: ["Iron", "Mercury", "Lead", "Zinc"], answer: 1 },
      { q: "What is the capital city of Canada?", options: ["Toronto", "Vancouver", "Ottawa", "Montreal"], answer: 2 },
      { q: "How many strings does a standard guitar have?", options: ["4", "5", "6", "7"], answer: 2 },
      { q: "Which ancient civilization built the pyramids of Giza?", options: ["Romans", "Greeks", "Egyptians", "Mayans"], answer: 2 }
    ]
  ];

  const setLabels = ['Set A', 'Set B', 'Set C'];
  const TIME_PER_QUESTION = 10;

  // ---- State ----
  let activeSetIndex = 0;
  let questions = [];
  let currentIndex = 0;
  let score = 0;
  let selectedIndex = null;
  let userAnswers = [];
  let timeLeft = TIME_PER_QUESTION;
  let timerInterval = null;

  // ---- DOM refs ----
  const qNumber = document.getElementById('qNumber');
  const qText = document.getElementById('qText');
  const setLabel = document.getElementById('setLabel');
  const optionsList = document.getElementById('optionsList');
  const nextBtn = document.getElementById('nextBtn');
  const progressLabel = document.getElementById('progressLabel');
  const scoreLabel = document.getElementById('scoreLabel');
  const trackFill = document.getElementById('trackFill');
  const timerFill = document.getElementById('timerFill');
  const timerNum = document.getElementById('timerNum');
  const quizArea = document.getElementById('quizArea');
  const resultArea = document.getElementById('resultArea');
  const scoreBig = document.getElementById('scoreBig');
  const accuracyLine = document.getElementById('accuracyLine');
  const restartBtn = document.getElementById('restartBtn');
  const themeToggle = document.getElementById('themeToggle');
  const reviewList = document.getElementById('reviewList');

 
  themeToggle.addEventListener('click', () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeToggle.textContent = isDark ? 'Dark Mode' : 'Light Mode';
  });

    function pickRandomSet() {
    activeSetIndex = Math.floor(Math.random() * questionSets.length);
    questions = questionSets[activeSetIndex];
    userAnswers = new Array(questions.length).fill(null);
  }

   function renderQuestion() {
    selectedIndex = null;
    const current = questions[currentIndex];

    qNumber.textContent = 'Q' + (currentIndex + 1);
    setLabel.textContent = setLabels[activeSetIndex] + ' · General Knowledge';
    qText.textContent = current.q;
    progressLabel.textContent = 'Question ' + (currentIndex + 1) + ' of ' + questions.length;
    scoreLabel.textContent = 'Answered: ' + currentIndex;
    trackFill.style.width = ((currentIndex) / questions.length * 100) + '%';

    optionsList.textContent = '';
    const letters = ['A', 'B', 'C', 'D'];

    current.options.forEach((optionText, i) => {
      const btn = document.createElement('button');
      btn.className = 'option js-option';
      btn.type = 'button';

      const letterSpan = document.createElement('span');
      letterSpan.className = 'letter';
      letterSpan.textContent = letters[i];

      const textSpan = document.createElement('span');
      textSpan.textContent = optionText;

      btn.appendChild(letterSpan);
      btn.appendChild(textSpan);

      btn.addEventListener('click', () => handleSelect(i, btn));
      optionsList.appendChild(btn);
    });

    nextBtn.classList.add('is-visible');
    nextBtn.textContent = (currentIndex === questions.length - 1) ? 'See Result' : 'Next Question';

    startTimer();
  }

   function handleSelect(i, clickedBtn) {
    selectedIndex = i;
    document.querySelectorAll('.js-option').forEach(btn => btn.classList.remove('is-selected'));
    clickedBtn.classList.add('is-selected');
  }

    function startTimer() {
    clearInterval(timerInterval);
    timeLeft = TIME_PER_QUESTION;
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      timeLeft -= 1;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        goToNext();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    timerNum.textContent = timeLeft + 's';
    const pct = (timeLeft / TIME_PER_QUESTION) * 100;
    timerFill.style.width = pct + '%';
    timerFill.classList.toggle('is-urgent', timeLeft <= 3);
  }

  
  function goToNext() {
    clearInterval(timerInterval);

    const current = questions[currentIndex];
    userAnswers[currentIndex] = selectedIndex;
    if (selectedIndex !== null && selectedIndex === current.answer) {
      score += 1;
    }

    document.querySelectorAll('.js-option').forEach(btn => { btn.disabled = true; });

    if (currentIndex < questions.length - 1) {
      currentIndex += 1;
      renderQuestion();
    } else {
      showResult();
    }
  }

  nextBtn.addEventListener('click', goToNext);

  function showResult() {
    clearInterval(timerInterval);
    quizArea.style.display = 'none';
    resultArea.style.display = 'block';

    const accuracy = Math.round((score / questions.length) * 100);
    scoreBig.textContent = score + '/' + questions.length;
    accuracyLine.textContent = 'Accuracy: ' + accuracy + '%';

    renderReview();
  }

  function renderReview() {
    reviewList.textContent = '';

    const title = document.createElement('div');
    title.className = 'review-title';
    title.textContent = 'Answer Key';
    reviewList.appendChild(title);

    const letters = ['A', 'B', 'C', 'D'];

    questions.forEach((current, idx) => {
      const userChoice = userAnswers[idx];
      const wasCorrect = userChoice !== null && userChoice === current.answer;

      const item = document.createElement('div');
      item.className = 'review-item';

      const qLine = document.createElement('p');
      qLine.className = 'review-q';
      qLine.textContent = 'Q' + (idx + 1) + '. ' + current.q;
      item.appendChild(qLine);

      const correctLine = document.createElement('div');
      correctLine.className = 'review-line answer-key';
      const correctBadge = document.createElement('span');
      correctBadge.className = 'tag-badge';
      correctBadge.textContent = 'Correct';
      const correctText = document.createElement('span');
      correctText.textContent = letters[current.answer] + '. ' + current.options[current.answer];
      correctLine.appendChild(correctBadge);
      correctLine.appendChild(correctText);
      item.appendChild(correctLine);

      const yourLine = document.createElement('div');
      yourLine.className = 'review-line ' + (userChoice === null ? '' : (wasCorrect ? 'correct' : 'wrong'));
      const yourBadge = document.createElement('span');
      yourBadge.className = 'tag-badge';
      yourBadge.textContent = userChoice === null ? 'Skipped' : (wasCorrect ? 'Your pick ✓' : 'Your pick ✗');
      const yourText = document.createElement('span');
      yourText.textContent = userChoice === null
        ? 'No answer selected in time'
        : letters[userChoice] + '. ' + current.options[userChoice];
      yourLine.appendChild(yourBadge);
      yourLine.appendChild(yourText);
      item.appendChild(yourLine);

      reviewList.appendChild(item);
    });
  }

  restartBtn.addEventListener('click', () => {
    currentIndex = 0;
    score = 0;
    selectedIndex = null;
    pickRandomSet();
    resultArea.style.display = 'none';
    quizArea.style.display = 'block';
    renderQuestion();
  });

  // ---- Init ----
  pickRandomSet();
  renderQuestion();
</script>
</body>
</html>
